name: 'nancheung'

on:
  push:
  schedule:
    - cron: '1 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5 # Checking out the repo
    - name: Build   # 只用标准库，直接用 runner 自带的 Python 3
      run: python3 main.py
    - name: Commit and push if changed   # 更新README.md
      run: |
        git diff
        git config --global user.email "i@nancheung.com"
        git config --global user.name "NanCheung"
        git add README.md
        git diff --cached --quiet && echo "README 无变化，跳过提交" && exit 0
        git commit -m "Github Action Auto Updated"
        git push
